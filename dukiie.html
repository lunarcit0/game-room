<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dukiie · lunarcit0’s Game Room</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile-app.css"><style>.dukiie-main{max-width:1100px;margin:auto;padding:16px}.dukiie-screen{aspect-ratio:16/10;background:#271f1c;border:1px solid #a78270}.dukiie-screen iframe{display:block;border:0;width:100%;height:100%}.dukiie-controls{display:flex;justify-content:space-between;gap:12px;padding:15px 0;flex-wrap:wrap}.dukiie-controls div{display:flex;gap:8px}.dukiie-controls button{min-width:54px;min-height:54px;background:#edd1df;color:#67454f;border:1px solid #b98b9f;touch-action:none;user-select:none}.dukiie-controls button.held{background:#a56e8a;color:white}.dukiie-note{color:#795e66;font-size:13px;line-height:1.6}@media(orientation:landscape) and (max-height:550px){header,.dukiie-main h1,.dukiie-note{display:none}.dukiie-main{padding:6px}.dukiie-screen{height:calc(100dvh - 105px);aspect-ratio:auto}.dukiie-controls{padding:8px 0}}</style></head><body><header><a class="brand" href="index.html">← All games</a></header><main class="dukiie-main"><h1>Dukiie</h1><p class="dukiie-note">Tap the game to start. Use the buttons below to move, jump, shoot, or talk. Landscape gives you more space.</p><div class="dukiie-screen"><iframe id="dukiie-frame" src="dukiie/game/index.html" title="Play Dukiie" allow="autoplay; fullscreen; gamepad"></iframe></div><div class="dukiie-controls" aria-label="Dukiie touch controls"><div><button data-key="KeyA" aria-label="Move left">←</button><button data-key="KeyD" aria-label="Move right">→</button><button data-key="KeyS" aria-label="Move down">↓</button></div><div><button data-key="KeyW">Jump</button><button data-key="KeyZ">Shoot</button><button data-key="KeyX">Talk</button></div></div><p class="dukiie-note">Game by lunarcit0. Touch buttons map to the original A/D/S, W, Z, and X controls. You can also use a keyboard.</p><p id="dukiie-control-status" class="dukiie-note" role="status">Controls ready. The game may take a moment to load.</p></main><script src="dukiie-controls.js"></script></body></html>
